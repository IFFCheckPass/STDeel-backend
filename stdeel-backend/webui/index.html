<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思谛 STDeel 管理台</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #334155;
    --line: #334155; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 440px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .search { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid #26324a; }
  tr.clickable { cursor: pointer; transition: background .15s; }
  tr.clickable:hover { background: #27364f; }
  tr.active { background: #1e3a52; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .pill.on { background: #123524; color: var(--ok); }
  .pill.off { background: #3a1d1d; color: var(--bad); }
  .bar { height: 7px; border-radius: 999px; background: #26324a; overflow: hidden; min-width: 80px; width: 100%; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .rate { display: inline-block; width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 14px 4px; }
  .tag { color: var(--warn); font-size: 12px; }
  .scroll { max-height: 62vh; overflow: auto; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 1200px) { .row2 { grid-template-columns: 1fr; } }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: #3b4b66; }
  .btn.danger { border-color: #7f3a3a; color: var(--bad); }
  .btn.danger:hover { background: #3a1d1d; }
  .btn.sm { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
  .fb-correct { color: var(--ok); }
  .fb-partial { color: var(--warn); }
  .fb-wrong { color: var(--bad); }
  .fb-none { color: var(--muted); }
  .record { padding: 10px 0; border-bottom: 1px solid #26324a; }
  .record .q { font-weight: 600; margin-bottom: 4px; }
  .record .a { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .record .meta-row { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>思谛 STDeel 管理台</h1>
  <div class="toolbar">
    <span class="sub" id="totalLabel"></span>
    <button class="btn" id="btnRefresh">↻ 刷新</button>
    <button class="btn" id="btnLogout">退出</button>
  </div>
</header>

<div class="grid">
  <div class="card">
    <h2>👤 用户</h2>
    <input class="search" id="search" placeholder="搜索用户名 / 设备号…" autocomplete="off">
    <div class="scroll">
      <table>
        <thead><tr><th>user_id</th><th>用户名</th><th>device</th><th>注册时间</th><th>操作</th></tr></thead>
        <tbody id="userBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2 id="detailTitle">📊 详情（点击左侧用户查看）</h2>
    <div class="row2">
      <div>
        <h2>🔑 API Key</h2>
        <div id="apiKeyBox"><span class="empty">未选择用户</span></div>
      </div>
      <div>
        <h2>📈 知识点掌握</h2>
        <div id="masteryBox"><span class="empty">未选择用户</span></div>
      </div>
    </div>
    <h2 style="margin-top:18px">📖 解题记录</h2>
    <div id="recordsBox"><span class="empty">未选择用户</span></div>
  </div>
</div>

<script src="/webui/app.js"></script>
</body>
</html>
